<div class="animated fadeIn">
  <p-panel #pnl [style]="{ 'margin-bottom': '10px' }">
    <p-header> Quản lý quyền </p-header>
    <div class="grid">
      <div class="col-6">
        <button
          pButton
          type="button"
          label="Thêm"
          icon="fa fa-plus"
        
          class="ml-1 p-button-info"
        ></button>
        <button
          pButton
          type="button"
          label="Xóa"
          icon="fa fa-trash"
          class="ml-1 p-button-danger"
          *ngIf="selectedItems.length > 0"
          (click)="deleteItems()"
        ></button>
        <button
          pButton
          type="button"
          label="Sửa"
          icon="fa fa-edit"
          class="ml-1 p-button-help"
          *ngIf="selectedItems.length === 1"
       
        ></button>
      </div>
      <div class="col-6">
        <div class="formgroup-inline">
          <div class="field">
            <input
              id="txtKeyword"
              pInputText
              (keyup.enter)="loadData()"
            
              placeholder="Nhập tên role..."
              type="text"
            />
          </div>
          <button pButton type="button" pButton (click)="loadData()">Tìm</button>
        </div>
      </div>
    </div>
    <p-table
      #dt
      [value]="items"
      selectionMode="multiple"
      dataKey="id"
      [(selection)]="selectedItems"
      [metaKeySelection]="true"
      [responsive]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 10px">
            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
          </th>
          <th>Tên</th>
          <th>Mô tả</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr [pSelectableRow]="row">
          <td style="width: 10px">
            <span class="ui-column-title"></span>
            <p-tableCheckbox [value]="row"></p-tableCheckbox>
          </td>
          <td>{{ row.name }}</td>
          <td>{{ row.description }}</td>
          <td>
            <button pButton>Phân quyền</button>
          </td>
        </tr>
      </ng-template>
    </p-table>

  </p-panel>
</div>
